# Render blueprint — deploys the BridgeSure API from the repo root.
# Import at https://render.com -> New -> Blueprint, or run `render blueprints launch`.
#
# Fill the `sync: false` env vars in the Render service's Environment panel after import:
#   - CLEANVERSE_API_ID / CLEANVERSE_API_KEY  (required even in demo mode)
#   - BRIDGESURE_RELEASE_SIGNER_PRIVATE_KEY   (0x + 64 hex, generated with `cast wallet new`)
#   - BRIDGESURE_WEB_ORIGIN                   (your Vercel frontend URL, CORS allow-list)
#   - DATABASE_URL                            (optional Postgres for a durable audit registry)
# Any of the optional private keys you leave blank can stay blank.

services:
  - type: web
    name: bridgesure-api
    runtime: node
    plan: free
    rootDir: .
    healthCheckPath: /health
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@11.20.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @bridgesure/domain build &&
      pnpm --filter @bridgesure/cleanverse build
    startCommand: pnpm --filter @bridgesure/api start
    envVars:
      # --- runtime ---
      - key: NODE_VERSION
        value: 24
      # The app reads BRIDGESURE_PORT (not Render's PORT). 10000 = Render's
      # default web-service port. Adjust if you map a custom port/domain.
      - key: BRIDGESURE_PORT
        value: 10000
      # --- Cleanverse boundary ---
      # demo (default): scripted sandbox mock, no network needed.
      # live: real Cleanverse transport (requires API id/key).
      - key: BRIDGESURE_CLEANVERSE_MODE
        value: demo
      - key: BRIDGESURE_CHAIN
        value: monad
      - key: BRIDGESURE_CHAIN_ID
        value: 10143
      - key: BRIDGESURE_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: BRIDGESURE_TRADE_ID
        value: bridgesure-demo-trade-001
      # --- demo resources (Monad Testnet) ---
      - key: BRIDGESURE_IMPORTER_ADDRESS
        value: 0x4aa29d0188d81A39cBd2BF11C1791aF3fF294E3A
      - key: BRIDGESURE_EXPORTER_ADDRESS
        value: 0xaABb93dA3999765dD48a40d70054190AE3361506
      - key: BRIDGESURE_ADMIN_ADDRESS
        value: 0x13cd068321C624d63C4A1d0eA2eBd806c22B9FA7
      - key: BRIDGESURE_ATOKEN_ADDRESS
        value: 0xaC0893567D43C3E7e6e35a72803df05416C1f20D
      - key: BRIDGESURE_VALIDATOR_ADDRESS
        value: 0xaC7e5179C2C7f03f209136886c172eb34F161792
      # The deployed BridgeSureEscrow becomes the CVI validator pool. Public
      # address; leave set for real releases, or blank for a pure demo.
      - key: BRIDGESURE_ESCROW_ADDRESS
        value: 0x6391427d323a43427c42df61369862f83f1f68ca
      # CORS allow-list: set to the deployed Vercel frontend, no trailing slash.
      - key: BRIDGESURE_WEB_ORIGIN
        sync: false
      # --- secrets (fill via Dashboard; never commit values) ---
      - key: CLEANVERSE_API_ID
        sync: false
      - key: CLEANVERSE_API_KEY
        sync: false
      - key: BRIDGESURE_RELEASE_SIGNER_PRIVATE_KEY
        sync: false
      # --- optional live provisioning keys (only for sandbox writes) ---
      - key: BRIDGESURE_DEPLOYER_PRIVATE_KEY
        sync: false
      - key: BRIDGESURE_IMPORTER_PRIVATE_KEY
        sync: false
      - key: BRIDGESURE_VALIDATOR_OWNER_PRIVATE_KEY
        sync: false
      # --- optional durable registry (Render Postgres / Supabase / Neon) ---
      - key: DATABASE_URL
        sync: false