packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Optional native speedups for ws (a wallet-connect transitive dep); their
  # build scripts are not needed, so explicitly deny (acknowledges the ignore).
  bufferutil: false
  utf-8-validate: false
  # better-sqlite3 ships a prebuilt binary; allow its install script so the
  # SQLite registry driver works without manual build steps.
  better-sqlite3: true
  esbuild: true
  sharp: true
