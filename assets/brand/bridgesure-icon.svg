<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BridgeSure icon</title>
  <desc id="desc">A blue bridge connecting two pillars with a shield at its center, representing trusted settlement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081A33"/>
      <stop offset="1" stop-color="#123B67"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42D9FF"/>
      <stop offset="1" stop-color="#3C7CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020A16" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M74 382h364" stroke="#294F78" stroke-width="12" stroke-linecap="round"/>

  <!-- Bridge pillars -->
  <path d="M104 372V244h54v128M354 372V244h54v128" fill="#D9F6FF"/>
  <path d="M91 244h80M341 244h80" stroke="#D9F6FF" stroke-width="16" stroke-linecap="round"/>

  <!-- Suspension bridge -->
  <path d="M131 244c54 128 196 128 250 0" fill="none" stroke="url(#bridge)" stroke-width="18" stroke-linecap="round"/>
  <path d="M131 244c54 70 196 70 250 0" fill="none" stroke="#7DEBFF" stroke-opacity=".55" stroke-width="5"/>
  <path d="M167 277v67M204 301v43M241 311v33M278 301v43M315 277v67" stroke="#42D9FF" stroke-width="7" stroke-linecap="round" opacity=".9"/>

  <!-- Trust shield -->
  <g filter="url(#shadow)">
    <path d="M256 118l72 28v61c0 56-31 91-72 111-41-20-72-55-72-111v-61z" fill="#F5FCFF"/>
    <path d="M256 137l53 21v49c0 39-20 67-53 86-33-19-53-47-53-86v-49z" fill="#123B67"/>
    <path d="M226 207l21 21 40-43" fill="none" stroke="#55E1FF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="131" cy="244" r="11" fill="#55E1FF"/>
  <circle cx="381" cy="244" r="11" fill="#55E1FF"/>
</svg>
